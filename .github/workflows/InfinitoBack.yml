name: Compilar e implementar la aplicación de .NET Core en la aplicación web InfinitoBack
on:
  push:
    branches:
    - Clientes-y-Reservas
permissions:
  id-token: write
  contents: read
env:
  AZURE_WEBAPP_NAME: InfinitoBack
  AZURE_WEBAPP_PACKAGE_PATH: infinitoBack/publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: infinitoBack
jobs:
  build:
    environment: InfinitoBack_Env
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Install EF Core Tool
      run: dotnet tool install --global dotnet-ef

    - name: Apply Migrations for Main DB
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
      run: |
        cd ${{ env.WORKING_DIRECTORY }}
        dotnet ef database update --context AppDbContext

    - name: Apply Migrations for Audit DB
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
      run: |
        cd ${{ env.WORKING_DIRECTORY }}
        dotnet ef database update --context AuditDbContext
    - name: Test
      run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    environment: InfinitoBack_Env
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.InfinitoBack_CLIENT_ID_D932 }}
        tenant-id: ${{ vars.InfinitoBack_TENANT_ID_D932 }}
        subscription-id: ${{ vars.InfinitoBack_SUBSCRIPTION_ID_D932 }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
