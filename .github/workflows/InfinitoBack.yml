name: Build, Migrate and Deploy InfinitoBack

on:
  push:
    branches:
      - Clientes-y-Reservas

permissions:
  id-token: write  # Requerido para OIDC
  contents: read

env:
  AZURE_WEBAPP_NAME: 'InfinitoBack'
  AZURE_SQL_SERVER: 'infinitoserver.database.windows.net'
  AZURE_SQL_RESOURCE_GROUP: 'grupo'
  DOTNET_CORE_VERSION: '10.0.x'
  PROJECT_FILE: infinitoBack
  AZURE_WEBAPP_PACKAGE_PATH: './publish'

jobs:
  build:
    environment: InfinitoBack_Env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_FILE }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_FILE }}" --configuration Release --no-restore

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Test
        run: dotnet test "${{ env.PROJECT_FILE }}" --no-build || true

      - name: Build & Publish API
        run: |
          dotnet publish "${{ env.PROJECT_FILE }}" --configuration Release --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --no-restore

      - name: Generate EF Core Migration Bundles (AppDbContext & AuditDbContext)
        run: |
          dotnet ef migrations bundle --context AppDbContext --project "${{ env.PROJECT_FILE }}" -r linux-x64 --self-contained -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/bundle-app
          dotnet ef migrations bundle --context AuditDbContext --project "${{ env.PROJECT_FILE }}" -r linux-x64 --self-contained -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/bundle-audit

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    environment: InfinitoBack_Env
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp-publish
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.InfinitoBack_CLIENT_ID_6012 }}
          tenant-id: ${{ vars.InfiniosBack_TENANT_ID_6012 }} # Mantenido con tu nomenclatura exacta
          subscription-id: ${{ vars.InfinitoBack_SUBSCRIPTION_ID_6012 }}

      - name: Whitelist GitHub Runner IP in Azure SQL
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          az sql server firewall-rule create \
            --resource-group ${{ env.AZURE_SQL_RESOURCE_GROUP }} \
            --server ${{ env.AZURE_SQL_SERVER }} \
            --name "GitHubRunner-$GITHUB_RUN_ID" \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP

      - name: Apply EF Core Migrations
        env:
          DB_CONN: ${{ secrets.AZURE_SQL_CONNECTIONSTRING }}
        run: |
          chmod +x ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/bundle-app
          chmod +x ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/bundle-audit
          ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/bundle-app --connection "$DB_CONN"
          ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/bundle-audit --connection "$DB_CONN"

      - name: Remove Runner IP from Azure SQL Firewall
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group ${{ env.AZURE_SQL_RESOURCE_GROUP }} \
            --server ${{ env.AZURE_SQL_SERVER }} \
            --name "GitHubRunner-$GITHUB_RUN_ID" || true

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}