namename: Build, Migrate and Deploy InfinitoBack

on:
  push:
    branches:
      - Clientes-y-Reservas

permissions:
  id-token: write  # Requerido para autenticación mediante OIDC
  contents: read

env:
  AZURE_WEBAPP_NAME: 'InfinitoBack'
  AZURE_SQL_SERVER: 'infinitoserver.database.windows.net'
  AZURE_SQL_RESOURCE_GROUP: 'grupo'         # Grupo de la Base de Datos
  AZURE_APP_RESOURCE_GROUP: 'infinit_group' # Grupo del Web App
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'infinitoBack/InfinitoBack.csproj' # Ruta directa y limpia al csproj

jobs:
  build-and-deploy:
    environment: InfinitoBack_Env
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # 1. Compilación y publicación del proyecto API
    - name: Build & Publish API
      run: |
        dotnet restore "${{ env.PROJECT_PATH }}"
        dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --output ./publish --no-restore

    # 2. Generación de Migration Bundles para AppDbContext y AuditDbContext
    - name: Generate EF Core Migration Bundles
      run: |
        dotnet tool install --global dotnet-ef
        dotnet ef migrations bundle --context AppDbContext --project "${{ env.PROJECT_PATH }}" -r linux-x64 --self-contained -o ./publish/bundle-app
        dotnet ef migrations bundle --context AuditDbContext --project "${{ env.PROJECT_PATH }}" -r linux-x64 --self-contained -o ./publish/bundle-audit

    # 3. Login seguro en Azure mediante OIDC
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ vars.InfinitoBack_CLIENT_ID_D932 }}
        tenant-id: ${{ vars.InfinitoBack_TENANT_ID_D932 }}
        subscription-id: ${{ vars.InfinitoBack_SUBSCRIPTION_ID_D932 }}

    # 4. Whitelist: Usando la variable correcta de SQL Resource Group
    - name: Whitelist GitHub Runner IP in Azure SQL
      run: |
        RUNNER_IP=$(curl -s https://api.ipify.org)
        echo "Runner IP: $RUNNER_IP"
        az sql server firewall-rule create \
          --resource-group ${{ env.AZURE_SQL_RESOURCE_GROUP }} \
          --server ${{ env.AZURE_SQL_SERVER }} \
          --name "GitHubRunner-$GITHUB_RUN_ID" \
          --start-ip-address $RUNNER_IP \
          --end-ip-address $RUNNER_IP

    # 5. Ejecución de los bundles de migración
    - name: Apply EF Core Migrations
      env:
        DB_CONN: ${{ secrets.DB_CONNECTION_STRING }}
      run: |
        chmod +x ./publish/bundle-app
        chmod +x ./publish/bundle-audit
        ./publish/bundle-app --connection "$DB_CONN"
        ./publish/bundle-audit --connection "$DB_CONN"

    # 6. Limpieza del Firewall
    - name: Remove Runner IP from Azure SQL Firewall
      if: always()
      run: |
        az sql server firewall-rule delete \
          --resource-group ${{ env.AZURE_SQL_RESOURCE_GROUP }} \
          --server ${{ env.AZURE_SQL_SERVER }} \
          --name "GitHubRunner-$GITHUB_RUN_ID" || true

    # 7. Despliegue a Azure App Service
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ./publish